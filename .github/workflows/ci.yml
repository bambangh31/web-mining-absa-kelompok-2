name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    name: Dependencies, pipeline tests and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Test preprocessing, annotation, LLM parsing, metrics and B1 models (synthetic data only)
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: |
          python -m compileall -q src
          python -c "from pathlib import Path; files = list(Path('src').rglob('*.py')); print(f'Checked {len(files)} Python files in src/. BiLSTM/IndoBERT tests are skipped when torch is not installed.')"
